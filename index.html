<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kappa kundkontakter</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --text: #e8eaf0;
      --muted: #6b7280;
      --success: #34d399;
      --danger: #f87171;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      color: var(--text);
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1;
      min-width: 180px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      margin-top: 1rem;
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 0.3rem 0.7rem;
      font-size: 0.8rem;
    }

    .status {
      margin-top: 0.75rem;
      font-size: 0.88rem;
      min-height: 1.2em;
    }

    .status.ok { color: var(--success); }
    .status.err { color: var(--danger); }
    .status.loading { color: var(--muted); }

    .stats-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stat-chip span { color: var(--text); font-weight: 600; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead th {
      text-align: left;
      padding: 0.6rem 0.8rem;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(79,142,247,0.04); }

    td {
      padding: 0.75rem 0.8rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--text);
    }

    td.actions { font-family: 'DM Sans', sans-serif; }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>📞 Kappa kundkontakter</h1>
    <p>Dokumenterade reaches — synkroniseras på alla enheter</p>
  </header>

  <!-- Lägg till kontakt -->
  <div class="card">
    <h2>✉️ Lägg till ny kontakt</h2>
    <div class="form-row">
      <div class="form-group">
        <label>E-postadress</label>
        <input type="email" id="emailInput" placeholder="namn@exempel.se" />
      </div>
      <div class="form-group">
        <label>Telefonnummer</label>
        <input type="tel" id="phoneInput" placeholder="+46 70 123 45 67" />
      </div>
    </div>
    <button class="btn btn-primary" id="addBtn" onclick="addContact()">➕ Lägg till kontakt</button>
    <div class="status" id="addStatus"></div>
  </div>

  <!-- Kontaktlista -->
  <div class="card">
    <h2>📋 Kontakter jag har mejlat</h2>
    <div class="stats-row">
      <div class="stat-chip">Totalt: <span id="totalCount">–</span></div>
    </div>
    <div id="tableWrapper">
      <div class="empty"><span class="spinner"></span> Laddar kontakter…</div>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7hynDPtoSzWEN0xEvbs0VXmbUTW5T_Y7IxrRPoQ41Up9ncJurZlkQAvSGuFK4OOR4/exec";

  async function loadContacts() {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      renderTable(data);
    } catch (e) {
      document.getElementById("tableWrapper").innerHTML =
        '<div class="empty">⚠️ Kunde inte ladda kontakter. Kontrollera Google Script.</div>';
    }
  }

  function renderTable(contacts) {
    document.getElementById("totalCount").textContent = contacts.length;

    if (contacts.length === 0) {
      document.getElementById("tableWrapper").innerHTML =
        '<div class="empty">Inga kontakter ännu. Lägg till din första ovan! ✨</div>';
      return;
    }

    let html = `<table>
      <thead><tr>
        <th>📧 E-post</th>
        <th>📱 Telefon</th>
      </tr></thead>
      <tbody>`;

    contacts.forEach(c => {
      html += `<tr>
        <td>${escHtml(c.email || "–")}</td>
        <td>${escHtml(c.phone || "–")}</td>
      </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById("tableWrapper").innerHTML = html;
  }

  async function addContact() {
    const email = document.getElementById("emailInput").value.trim();
    const phone = document.getElementById("phoneInput").value.trim();
    const status = document.getElementById("addStatus");
    const btn = document.getElementById("addBtn");

    if (!email && !phone) {
      status.className = "status err";
      status.textContent = "⚠️ Fyll i minst e-post eller telefonnummer.";
      return;
    }

    btn.disabled = true;
    status.className = "status loading";
    status.innerHTML = '<span class="spinner"></span> Sparar…';

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, phone })
      });

      document.getElementById("emailInput").value = "";
      document.getElementById("phoneInput").value = "";
      status.className = "status ok";
      status.textContent = "✅ Kontakt sparad!";

      setTimeout(() => { status.textContent = ""; }, 3000);
      setTimeout(loadContacts, 1500);
    } catch (e) {
      status.className = "status err";
      status.textContent = "❌ Något gick fel. Försök igen.";
    }

    btn.disabled = false;
  }

  document.getElementById("emailInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("phoneInput").focus();
  });
  document.getElementById("phoneInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addContact();
  });

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  loadContacts();
</script>
</body>
</html>
